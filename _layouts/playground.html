{% include frontend-context.html %}
<!doctype html>
<html lang="ja" class="no-js classic-root playground-root" data-theme="dark" data-live2d-character="{{ classic_character }}">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>
  <body class="classic-site playground-page" data-playground-standalone="true" data-disable-mouse-firework="true">
    <main id="main" class="playground-host" aria-label="Playground">
      <div id="live2d-widget"></div>
      <noscript><p>Playground には JavaScript が必要です。<a href="{{ '/' | relative_url }}">ホームへ</a></p></noscript>
    </main>
    <template id="playground-workspace">
      <section class="pg-roster" aria-labelledby="pg-roster-title">
        <h2 class="pg-section-title" id="pg-roster-title">話し相手</h2>
      </section>
      <section class="pg-dialogue-desk" aria-label="会話"></section>
      <aside class="pg-tools" aria-label="遊びと音楽">
        <details class="pg-radio">
          <summary>
            <svg class="pg-radio-icon" viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">
              <path d="m4 7 14-5M3 7h18v11H3zM5.5 10h7m-7 2.5h7m-7 2.5h7"/>
              <circle cx="17" cy="12.5" r="2.2"/>
            </svg>
            幻想郷ラジオ
          </summary>
        </details>
        <div class="pg-launchers"></div>
      </aside>
    </template>
    {% include companion-runtime.html %}
    {% include scripts.html %}
  </body>
</html>
