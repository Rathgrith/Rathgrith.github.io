<header class="classic-masthead">
  <img class="classic-masthead-icon" src="{{ '/assets/images/classic/icons/16/directory_open_file_mydocs_small-1.png' | relative_url }}" alt="" width="16" height="16">
  <a class="classic-site-name" href="{{ '/' | relative_url }}">{{ site.author.name | escape }}</a>
  <span class="classic-window-label">{{ site.classic.window_label | default: "Personal homepage" | escape }}</span>
  <div class="classic-utilities">
    <div class="classic-themes" role="group" aria-label="Character color theme">
      {% for character in site.data.characters %}
      <button class="classic-theme-button" type="button" data-classic-character="{{ character.id }}" aria-pressed="{% if character.id == classic_character %}true{% else %}false{% endif %}" aria-label="{{ character.name | escape }} theme" title="{{ character.name | escape }} theme"><img src="{{ character.icon | relative_url }}" alt="" width="32" height="32"></button>
      {% endfor %}
    </div>
    <div class="classic-options-slot" data-classic-options-slot></div>
  </div>
</header>
<div class="classic-toolbar">
  <nav class="classic-navigation" aria-label="Main navigation">
    {% for link in site.data.navigation.header %}
    <a class="classic-tab" href="{{ link.url | relative_url }}"{% if link.page %} data-classic-page="{{ link.page | escape }}"{% endif %}{% if link.full_navigation %} data-full-navigation{% endif %}>{% if link.icon %}<img class="classic-nav-icon" src="{{ '/assets/images/classic/icons/16/' | append: link.icon | relative_url }}" alt="" width="16" height="16">{% endif %}{{ link.title | escape }}</a>
    {% endfor %}
  </nav>
</div>
