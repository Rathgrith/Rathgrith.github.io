<header class="classic-masthead">
  <img class="classic-masthead-icon" src="{{ '/assets/images/classic/icons/16/directory_open_file_mydocs_small-1.png' | relative_url }}" alt="" width="16" height="16">
  <a class="classic-site-name" href="{{ '/' | relative_url }}">{{ site.author.name | escape }}</a>
  <span class="classic-window-label">Personal homepage</span>
  <div class="classic-utilities">
    <div class="classic-themes" role="group" aria-label="Character color theme">
      {% assign character_themes = 'alice,marisa,patchouli' | split: ',' %}
      {% for character in character_themes %}
      <button class="classic-theme-button" type="button" data-classic-character="{{ character }}" aria-pressed="{% if character == 'alice' %}true{% else %}false{% endif %}" aria-label="{{ character | capitalize }} theme" title="{{ character | capitalize }} theme"><img src="{{ '/assets/images/classic/characters/' | append: character | append: '.svg' | relative_url }}" alt="" width="32" height="32"></button>
      {% endfor %}
    </div>
    <div class="classic-options-slot" data-classic-options-slot></div>
  </div>
</header>
<div class="classic-toolbar">
  <nav class="classic-navigation" aria-label="Main navigation">
    <a class="classic-tab" href="{{ '/' | relative_url }}" data-classic-page="home"><img class="classic-nav-icon" src="{{ '/assets/images/classic/icons/16/directory_closed-1.png' | relative_url }}" alt="" width="16" height="16">Home</a>
    <a class="classic-tab" href="{{ '/#publications' | relative_url }}"><img class="classic-nav-icon" src="{{ '/assets/images/classic/icons/16/notepad_file-1.png' | relative_url }}" alt="" width="16" height="16">Publications</a>
    <a class="classic-tab" href="{{ '/gallery/' | relative_url }}" data-classic-page="gallery"><img class="classic-nav-icon" src="{{ '/assets/images/classic/icons/16/gallery.svg' | relative_url }}" alt="" width="16" height="16">Gallery</a>
    <a class="classic-tab" href="{{ '/playground/' | relative_url }}" data-full-navigation><img class="classic-nav-icon" src="{{ '/assets/images/classic/icons/16/playground.svg' | relative_url }}" alt="" width="16" height="16">Playground</a>
    <a class="classic-tab" href="{{ '/assets/resume.pdf' | relative_url }}"><img class="classic-nav-icon" src="{{ '/assets/images/classic/icons/16/address_book_card_copy-1.png' | relative_url }}" alt="" width="16" height="16">CV</a>
  </nav>
</div>
