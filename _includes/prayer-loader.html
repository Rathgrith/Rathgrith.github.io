{% assign chime_id = "prayer-" | append: include.place %}
<span class="prayer-loader" data-loading-min-ms="1200">
  <svg class="prayer-loader__plate" viewBox="0 0 128 76" width="128" height="76" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
    <defs>
      <!-- Two castings on the same pixel grid. Their mouths share the origin. -->
      <g id="{{ chime_id }}-large">
        <path fill="var(--ink)" d="M-4-26h8v1h4v1h3v2h2v2h2v3h1v4h1v8h-1v4h-2v2h-4v1H-9V1h-5v-2h-2v-4h-1v-8h1v-4h1v-3h2v-2h2v-2h3v-1h4z"/>
        <path fill="var(--rim)" d="M-4-25h8v1h4v1h3v2h2v2h1v3h1v4h1v7h-1v4h-3v1h-24v-1h-3v-4h-1v-7h1v-4h1v-3h1v-2h2v-2h3v-1h4z"/>
        <path fill="var(--glass)" d="M-6-23H6v1h4v2h2v3h2v5h1v6h-1v4h-28v-4h-1v-6h1v-5h2v-3h2v-2h4z"/>
        <path fill="var(--shade)" d="M12-17h2v5h1v6h-1v4h-27v-2h19v-1h4v-2h2z"/>
        <path fill="var(--gleam)" d="M-8-22h4v1h-4zm-3 2h3v2h-2v2h-2v3h-2v-4h1v-2h2zM-15-11h2v4h-2zM9-21h2v1H9z"/>
        <path fill="var(--ink)" d="M-12-2h24v1h2v1h-4v1h-20V0h-4v-1h2z"/>
        <path fill="var(--rim)" d="M-11 0h8v1h-8zM4 0h6v1H4z"/>
      </g>
      <g id="{{ chime_id }}-small">
        <path fill="var(--ink)" d="M-4-23h8v1h4v1h2v2h2v2h1v3h1v10h-1v3h-2v2H7v1H-7V1h-4v-2h-2v-3h-1v-10h1v-3h1v-2h2v-2h2v-1h4z"/>
        <path fill="var(--rim)" d="M-4-22h8v1h4v1h2v2h1v2h1v3h1v8h-1v4h-2v1h-20v-1h-2v-4h-1v-8h1v-3h1v-2h1v-2h2v-1h4z"/>
        <path fill="var(--glass)" d="M-6-20H6v1h3v2h1v3h2v9h-1v3h-22v-3h-1v-9h2v-3h1v-2h3z"/>
        <path fill="var(--shade)" d="M11-14h1v9h-1v3h-22v-2H5v-1h4v-2h2z"/>
        <path fill="var(--gleam)" d="M-9-18h2v2h-2v3h-2v-3h1v-2zM-12-11h1v3h-1zM5-21h2v1H5z"/>
        <path fill="var(--ink)" d="M-10-1h20v1H7v1H-7V0h-3z"/>
      </g>

      <!-- Three silhouettes for a turning paper strip. The eyelet stays at (0, 0). -->
      <g id="{{ chime_id }}-rest">
        <path fill="#5e5358" d="M-2 0h6v8H3v6H2v5h-6v-7h1V5h1z"/>
        <path fill="#dfc8a3" d="M-2 0h5v7H2v7H1v4h-5v-6h1V5h1z"/>
        <path fill="#fff0c8" d="M-2 2h3v5H0v6h-1v3h-3v-4h1V5h1z"/>
        <path fill="var(--ribbon)" d="M-2 0h5v2h-5zm-2 16h5v2h-5zM-1 11h2v3h-2z"/>
      </g>
      <g id="{{ chime_id }}-left">
        <path fill="#5e5358" d="M-2 0h5v6H1v4h-2v4h-2v3h-2v2h-5v-5h2v-4h2V6h2V2h2z"/>
        <path fill="#dfc8a3" d="M-2 0h4v5H0v4h-2v4h-2v3h-2v2h-4v-4h2v-4h2V6h2V2h2z"/>
        <path fill="#fff0c8" d="M-2 1h2v3h-2v4h-2v4h-2v3h-2v2h-2v-3h2v-4h2V6h2V2h2z"/>
        <path fill="var(--ribbon)" d="M-2 0h4v2h-4zm-8 16h5v1h-1v1h-4zm5-5h2v2h-2z"/>
      </g>
      <g id="{{ chime_id }}-right">
        <path fill="#5e5358" d="M-1 0h4v3h1v3h2v4h2v3h2v4H5v-2H3v-3H1V8H0V4h-1z"/>
        <path fill="#dfc8a3" d="M-1 0h4v4h1v3h2v4h2v3h1v2H5v-2H3v-3H1V7H0V4h-1z"/>
        <path fill="#fff0c8" d="M-1 2h2v3h1v3h2v4h2v3H5v-1H3v-3H1V7H0V4h-1z"/>
        <path fill="var(--ribbon)" d="M-1 0h4v2h-4zm6 14h4v2H5zm-2-5h2v2H3z"/>
      </g>
    </defs>

    <!-- Willow leaves and the stepped branch follow the active window palette. -->
    <g fill="var(--twig)">
      <path d="M3 2h10v1h10v1h9v1h7v1h8v1h8v1h16V7h9V6h10V5h10V4h10V3h13v1h-12v1h-10v1H91v1H81v1h-9v2H54V9h-8V8h-8V7h-8V6h-8V5H12V4H3z"/>
      <path d="M20 4h2v2h-3v1h-3v1h-3V7h2V6h3V5h2zm83 0h2V3h4V2h3V1h3v1h-2v1h-3v1h-4v1h-3z"/>
    </g>
    <path fill="var(--leaf)" d="M14 7h5v2h-2v1h-3v2h-4v1H6v-1h2v-2h3V9h3zM23 4h3V3h-2V2h-2V1h-4v1h1v1h4zm82 1h5v1h5v1h3v2h-5V8h-4V7h-3zM113 1h6V0h4v1h-2v1h-3v1h-6z"/>
    <path fill="var(--leaf-light)" d="M10 10h3v1h-3zM14 8h3v1h-3zm98-1h3v1h-3zm4-6h3v1h-3z"/>

    {% assign chime_cast = "alice,marisa,patchouli" | split: "," %}
    {% for character in chime_cast %}
    <g class="prayer-loader__chime" data-chime="{{ character }}">
      <g fill="var(--thread)">
        <path class="prayer-loader__large" d="M-1-35h2v2H0v5h1v3h-2v-2h-1v-2h1z"/>
        <path class="prayer-loader__small" d="M-1-30h2v2H0v4h1v2h-2v-2h-1v-2h1z"/>
      </g>
      <g class="prayer-loader__bell">
        <use class="prayer-loader__large" href="#{{ chime_id }}-large"/>
        <use class="prayer-loader__small" href="#{{ chime_id }}-small"/>
        <g class="prayer-loader__motif" transform="translate(-10 -20)">
          {% case character %}
          {% when "alice" %}
          <!-- Shanghai's bow, bob, apron and a pair of red slippers. -->
          <path fill="#503f50" d="M5 0h4v1h2V0h4v3h-1v1h1v5h1v2h-2v2h1v1h2v2h-1v1h-3v2h-3v-2H8v2H5v-2H3v-1H2v-2h2v-2h1v-1H3V8h1V4h1z"/>
          <path fill="#ca5366" d="M5 0h3v1h2v1h1V1h2V0h2v3h-3v1H8V3H5zM5 17h3v2H5zm6 0h2v1h1v1h-3z"/>
          <path fill="#ffd584" d="M6 4h7v1h1v4h1v1h-3V7h-1V6H8v1H6v3H4V7h1V5h1z"/>
          <path fill="#f6d1a2" d="M7 6h4v1h2v2h-1v1H8V9H7z"/>
          <path fill="#493e50" d="M8 7h1v1H8zm3 0h1v1h-1z"/>
          <path fill="#688db8" d="M7 10h5v1h2v2h1v1h1v2H4v-2h1v-1h1v-2h1z"/>
          <path fill="#fff1ce" d="M7 10h2v1h2v-1h2v2h-2v1h1v1h1v1H6v-1h1v-1h1v-1H7zM3 11h3v2H3zm11-1h2V9h2v2h-2v1h-2z"/>
          <path fill="#e17980" d="M8 11h3v1H8zM5 1h2v1H5zm7 0h2v1h-2z"/>
          {% when "marisa" %}
          <!-- A bent witch hat, its ivory bow and a comet trailing below the brim. -->
          <path fill="#302e40" d="M10 1h4v1h2v1h2v2h-5v2h1v2h1v2h3v1h2v2h-3v1h-5v1H5v-1H1v-1H0v-2h2v-1h3V9h1V6h1V4h1V2h2z"/>
          <path fill="#66617b" d="M10 2h3v1h2v1h-3V3h-2v2H9v2H8V4h1V3h1zM1 12h4v1H3v1H1zm12 1h5v1h-5z"/>
          <path fill="#bd9c74" d="M6 9h3v1h5v2H8v-1H5v-1h1z"/>
          <path fill="#fff0c9" d="M11 7h2v1h1v1h1V8h2v3h-3v1h-1v-1h-3V8h1z"/>
          <path fill="#f4ce79" d="M15 13h1v2h1v1h2v1h-2v1h-1v2h-1v-2h-1v-1h-2v-1h2v-1h1zM3 18h4v-1h4v1H8v1H3zM2 4h1v1h1v1H3v1H2V6H1V5h1z"/>
          {% when "patchouli" %}
          <!-- A gilt crescent, open book, violet binding and rose bookmark. -->
          <path fill="#eac785" d="M7 0h4v1H8v1H7v3h1v1h4V5h2v2h-1v1h-2v1H7V8H5V7H4V3h1V1h2z"/>
          <path fill="#fff1bb" d="M7 0h3v1H7zM5 2h2v1H5zm10 0h1v1h1v1h-1v1h-1V4h-1V3h1z"/>
          <path fill="#3c334e" d="M1 10h3V9h3v1h2v1h2v-1h2V9h3V8h3v2h1v7h-4v1h-3v1H9v-1H6v-1H2v-1H1z"/>
          <path fill="#917395" d="M2 12h6v1h3v-1h3v-1h4v5h-4v1h-3v1H9v-1H6v-1H2z"/>
          <path fill="#e5c8a8" d="M2 10h4v1h2v1h2v4H8v-1H5v-1H2z"/>
          <path fill="#fff0c9" d="M11 12h2v-1h3v-1h2v4h-3v1h-3v1h-1zM3 10h3v1H3z"/>
          <path fill="#a28b92" d="M4 12h3v1H4zm9 0h3v1h-3z"/>
          <path fill="#d67491" d="M13 15h2v4h-1v-1h-1z"/>
          {% endcase %}
        </g>
        <path fill="var(--thread)" d="M-1 0h2v2h1v2H1v2h-2V4h-1V2h1z"/>
        <g class="prayer-loader__pendant">
          <path fill="var(--thread)" d="M0 4h1v6H0z"/>
          <g transform="translate(0 9)">
            <use class="prayer-loader__pose prayer-loader__rest" href="#{{ chime_id }}-rest"/>
            <use class="prayer-loader__pose prayer-loader__left" href="#{{ chime_id }}-left"/>
            <use class="prayer-loader__pose prayer-loader__right" href="#{{ chime_id }}-right"/>
          </g>
        </g>
      </g>
    </g>
    {% endfor %}
  </svg>
  <span class="prayer-loader__label" data-prayer-label>少女祈祷中…</span>
</span>
