{% assign started_at = site.site_started_at | default: '2023-10-28T12:31:48-05:00' %}
<div
  class="site-runtime"
  data-site-runtime
  data-site-start="{{ started_at | escape }}"
  data-site-commit="{{ site.site_started_commit | default: '' }}"
  aria-live="off"
>
  <div class="site-runtime__inner">
    <span class="site-runtime__label">Site Runtime</span>
    <time class="site-runtime__elapsed" data-site-runtime-elapsed hidden></time>
    <span class="site-runtime__since">since <time data-site-runtime-since datetime="{{ started_at | escape }}">{{ started_at | slice: 0, 10 | escape }}</time></span>
  </div>
</div>
