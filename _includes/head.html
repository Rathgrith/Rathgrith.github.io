<meta charset="utf-8">

{% include seo.html %}

<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<script>
  (function () {
    var saved = "light";
    var character = "alice";
    var weatherVisibility = null;

    try {
      var key = "site-theme";
      saved = localStorage.getItem(key);
      if (saved !== "dark" && saved !== "light") {
        saved = "light";
      }

      character = localStorage.getItem("site-live2d-character");
      if (["marisa", "alice", "patchouli"].indexOf(character) === -1) {
        character = "alice";
      }

      weatherVisibility = localStorage.getItem("site-weather-visible");
      if (weatherVisibility !== "true" && weatherVisibility !== "false") {
        weatherVisibility = null;
      }
    } catch (e) {}

    var isMobileWeatherViewport =
      window.matchMedia && window.matchMedia("(max-width: 36em)").matches;

    if (isMobileWeatherViewport) {
      weatherVisibility = "false";
    } else if (weatherVisibility === null) {
      weatherVisibility = "false";
    }

    document.documentElement.setAttribute("data-theme", saved);
    document.documentElement.style.colorScheme =
      saved === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-live2d-character", character);
    document.documentElement.setAttribute(
      "data-weather-visible",
      weatherVisibility
    );
  })();
</script>
