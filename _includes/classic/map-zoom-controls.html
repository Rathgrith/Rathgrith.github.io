<div class="atlas-zoom__controls" role="group" aria-label="Map zoom" hidden>
  <button type="button" data-atlas-zoom-out aria-label="Zoom out" title="Zoom out">−</button>
  <output data-atlas-scale aria-label="Zoom level" aria-live="polite">100%</output>
  <button type="button" data-atlas-zoom-in aria-label="Zoom in" title="Zoom in">+</button>
  <button type="button" data-atlas-reset aria-label="Reset map view" title="Reset map view">↺</button>
</div>
