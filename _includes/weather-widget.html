<section
  class="weather-dial"
  data-weather-widget
  data-weather-integrated="true"
  data-weather-baseurl="{{ '/' | relative_url }}"
  data-weather-default-latitude="52.4862"
  data-weather-default-longitude="-1.8904"
  data-weather-default-location="ウェスト・ミッドランズ"
  aria-label="天候の観測"
  aria-busy="true"
>
  <svg class="weather-dial__symbols" aria-hidden="true" focusable="false">
    <!-- Original weather sigils: readable conditions with restrained Gensokyo motifs. -->
    <symbol id="weather-icon-observe" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/><path d="m12 8 4 4-4 4-4-4Z"/></g>
    </symbol>
    <symbol id="weather-icon-clear" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 7a2.5 2.5 0 0 1 0 5 2.5 2.5 0 0 0 0 5M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/><path d="M12 9.5h.01M12 14.5h.01" stroke-width="1.9"/></g>
    </symbol>
    <symbol id="weather-icon-drizzle" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.5h12a3 3 0 0 0 .2-6 5 5 0 0 0-9.5-1.7A4 4 0 0 0 6 13.5Z"/><path d="m7 16.5-1.2 3M12 16.5l-1.2 3M17 16.5l-1.2 3"/><path d="M8.5 10.5h3"/></g>
    </symbol>
    <symbol id="weather-icon-cloud" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 17H5.5a3.5 3.5 0 0 1-.4-7 5 5 0 0 1 9.5-2.6 3.8 3.8 0 0 1 4.2 7.2H14"/><path d="M5 12.5h3a2 2 0 0 0 0-4M12 13.5l4 1-1.5 6-4-1Z"/><path d="m12.8 16 1 .3"/></g>
    </symbol>
    <symbol id="weather-icon-blue-sky" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a4 4 0 1 1 8 0M12 2v2M5 5l1.5 1.5M19 5l-1.5 1.5"/><path d="M3 13h14c3.8 0 3.8 4 1 4M5 18h8M7 21h6"/><path d="m8.5 12.8 2-1.3 1.5 1.3 1.5-1.3 2 1.3"/></g>
    </symbol>
    <symbol id="weather-icon-hail" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 12.5h12.8a2.7 2.7 0 0 0 .3-5.4 4.8 4.8 0 0 0-9.2-1.4 3.5 3.5 0 0 0-3.9 6.8Z"/><path d="m7 15.2 1.8 2.4L7 20l-1.8-2.4ZM13 16.8l1.8 2.4-1.8 2.4-1.8-2.4ZM18.5 14.8l1.5 2-1.5 2-1.5-2Z"/></g>
    </symbol>
    <symbol id="weather-icon-flower-cloud" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 15H5.7a3.7 3.7 0 0 1-.4-7.4 4.8 4.8 0 0 1 9.2-1.3A3.2 3.2 0 0 1 20 8"/><path d="M16.5 9.5c3-1.5 4.2.9 2.5 2.9 3.3.4 3.3 3.2.4 4.1 1 3.2-1.4 4.6-3.7 2.2-2.4 2.3-4.7.8-3.6-2.3-2.9-1.1-2.7-3.8.6-4.1-1.5-2 .1-4.3 2.8-2.8Z"/><circle cx="16" cy="15.1" r="1.2"/></g>
    </symbol>
    <symbol id="weather-icon-fog" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3a6 6 0 0 0 5 8 6.3 6.3 0 0 1-10-4.5A6 6 0 0 1 15 3Z"/><path d="M3 13h7c3 0 3-4 .3-4M6 17h15M3 21h13"/></g>
    </symbol>
    <symbol id="weather-icon-snow" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 8 3.5 4-3.5 4-3.5-4ZM12 2v6M12 16v6M3.3 7l5.2 3M15.5 14l5.2 3M3.3 17l5.2-3M15.5 10l5.2-3"/><path d="m9.5 3.5 2.5 2 2.5-2M9.5 20.5l2.5-2 2.5 2M3.4 9.8l3.1-1-.2-3M20.6 14.2l-3.1 1 .2 3M3.4 14.2l3.1 1-.2 3M20.6 9.8l-3.1-1 .2-3"/></g>
    </symbol>
    <symbol id="weather-icon-sun-rain" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 10.3A3.8 3.8 0 1 1 11 6M7.3 1.8v1.3M1.8 7.3h1.3M3.4 3.4l1 1M11.2 3.4l-1 1"/><path d="M8 15.5h10a3 3 0 0 0 .1-6 4.5 4.5 0 0 0-8.6.1 3.1 3.1 0 0 0-1.5 5.9Z"/><path d="m9 18-1.2 3M14 18l-1.2 3M19 18l-1.2 3"/></g>
    </symbol>
    <symbol id="weather-icon-shower" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13h12a3 3 0 0 0 .2-6 5 5 0 0 0-9.5-1.7A4 4 0 0 0 6 13Z"/><path d="M7 15.8s-1.6 2-1.6 3a1.6 1.6 0 0 0 3.2 0c0-1-1.6-3-1.6-3ZM16.5 15.8s-1.6 2-1.6 3a1.6 1.6 0 0 0 3.2 0c0-1-1.6-3-1.6-3Z"/><path d="m12 16-.8 2M10.5 21l.01-.01"/></g>
    </symbol>
    <symbol id="weather-icon-wind-rain" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h10c3 0 3-4 0-4-1.1 0-1.7.5-2 1.3M2 11h15.5c4 0 4-5.5.5-5.5M4 15h10.5"/><path d="m7.5 17.5-2 3M13 17.5l-2 3M18.5 16.5l-2 3"/></g>
    </symbol>
    <symbol id="weather-icon-squall" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5a3.5 3.5 0 0 1 .6-6.8A5 5 0 0 1 14.3 5a3.5 3.5 0 0 1 5.2 4.6M15 14h5"/><path d="m10 8 5 2-4.7 4.4 2.4 1.2-6.3 6.2 1.5-6.3L5 14Z"/><path d="M2.5 18h2M17 18h4"/></g>
    </symbol>
    <symbol id="weather-icon-river-fog" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5h11c3 0 3 4 0 4M6 9.5h3M2.5 13h19"/><path d="M3 17.5c3-3 5 3 8 0s5 3 10 0M4 21c3-2 5 2 8 0s5 2 8 0"/></g>
    </symbol>
    <symbol id="weather-icon-typhoon" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8c5-6 10-3.7 9 1.5-.6 3.3-3.5 6.5-7 6.5M12 16c-5 6-10 3.7-9-1.5C3.6 11.2 6.5 8 10 8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 8.5a1.75 1.75 0 0 1 0 3.5 1.75 1.75 0 0 0 0 3.5"/></g>
    </symbol>
    <symbol id="weather-icon-aurora" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5a4.7 4.7 0 0 0 4.5 6.2 5 5 0 1 1-4.5-6.2Z"/><path d="M3 17c4-8 6 5 10-2s6-5 8-9M4 21c4-8 6 4 10-2s6-3 7-7"/><path d="m18 2 1.2 2L18 6l-1.2-2Z"/></g>
    </symbol>
    <symbol id="weather-icon-calm" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14C7 10 10 4 12 2c2 2 5 8 0 12ZM12 14C6 14 4 10 4 7c4 .4 7 2.4 8 7Zm0 0c6 0 8-4 8-7-4 .4-7 2.4-8 7Z"/><path d="M3 17.5h18M7 21h10"/></g>
    </symbol>
    <symbol id="weather-icon-diamond" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 4.5 7L12 21l-4.5-11ZM7.5 10h9M12 3v18"/><path d="m3.5 5 1.7 3-1.7 3-1.7-3ZM20.5 13l1.7 3-1.7 3-1.7-3Z"/></g>
    </symbol>
    <symbol id="weather-icon-sand" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h11c3 0 3-4 0-4-1 0-1.8.6-2 1.5M2 12h16c4 0 4-5 .5-5M4 16h9"/><path d="m5 19 1 1-1 1-1-1ZM12 18l1 1-1 1-1-1ZM19 16l1 1-1 1-1-1Z" fill="currentColor" stroke="none"/></g>
    </symbol>
    <symbol id="weather-icon-blaze" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 1.5 3.5 3.6-1.2-.1 3.8 3.7 1-2.3 3 2.3 3-3.7 1 .1 3.8-3.6-1.2L12 22l-1.5-3.3-3.6 1.2.1-3.8-3.7-1 2.3-3-2.3-3 3.7-1-.1-3.8 3.6 1.2Z"/><circle cx="12" cy="12" r="4"/><path d="m12 9 1.5 3L12 15l-1.5-3Z" fill="currentColor" stroke="none"/></g>
    </symbol>
    <symbol id="weather-icon-plum-rain" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5a9 9 0 0 1 18 0c-2-1.5-4-1.5-6 0-2-1.5-4-1.5-6 0-2-1.5-4-1.5-6 0ZM12 2.5v-1M12 11v6.7c0 3.4 4.5 3.4 4.5.3"/><path d="M9 11.5c0-4 1-7 3-9M15 11.5c0-4-1-7-3-9M5.5 14.5l-.8 2.2M20 14.5l-.8 2.2M3.5 19l-.5 1.5"/></g>
    </symbol>
  </svg>

  <div class="weather-terminal__header"><span>広域気象端末</span><span class="weather-terminal__signal" data-weather-signal>受信待機</span></div>
  <div class="weather-terminal__lcd">
    <div class="weather-terminal__station"><span data-weather-location>ウェスト・ミッドランズ</span><span data-weather-coordinates>52.49°N / 1.89°W</span></div>
    <div class="weather-terminal__overview">
      <figure class="weather-map" aria-label="観測地点の世界地図">
        <img src="{{ '/assets/images/classic/weather/world-map.svg' | relative_url }}" width="360" height="180" alt="" draggable="false">
        <svg class="weather-map__overlay" viewBox="0 0 360 180" aria-hidden="true">
          <path class="weather-map__crosshair" data-weather-map-crosshair d="M178.11 0V180M0 37.51H360"/>
          <g data-weather-map-marker transform="translate(178.11 37.51)"><circle r="6"/><circle r="2" class="weather-map__point"/><path d="M-10 0h-4m24 0h4M0-10v-4m0 24v4"/></g>
        </svg>
        <figcaption><span>世界座標</span><span data-weather-daylight>--</span></figcaption>
      </figure>
      <div class="weather-terminal__reading">
        <div class="weather-terminal__condition"><svg class="weather-dial__icon" viewBox="0 0 24 24" aria-hidden="true"><use data-weather-icon-use href="#weather-icon-observe"></use></svg><span data-weather-name>観測待ち</span></div>
        <strong class="weather-dial__temperature" data-weather-temperature>--°C</strong>
        <span class="weather-terminal__range" data-weather-range>-- / --</span>
        <div class="weather-terminal__observed"><span>観測</span><time data-weather-time>--:--</time></div>
      </div>
    </div>
    <div class="weather-dial__description" data-weather-description>空模様を観測しています</div>
    <dl class="weather-terminal__metrics">
      <div><dt>湿度</dt><dd data-weather-humidity>--%</dd><meter data-weather-humidity-meter min="0" max="100" value="0" aria-label="湿度" hidden></meter></div>
      <div><dt>雲量</dt><dd data-weather-cloud>--%</dd><meter data-weather-cloud-meter min="0" max="100" value="0" aria-label="雲量" hidden></meter></div>
      <div><dt>風速</dt><dd data-weather-wind>--</dd><span data-weather-direction>--</span></div>
      <div><dt>気圧</dt><dd data-weather-pressure>--</dd><span>hPa</span></div>
    </dl>
    <figure class="weather-trend">
      <figcaption><span>24時間予報</span><span class="weather-trend__key">─ 気温 <i></i> 降水確率</span></figcaption>
      <div class="weather-trend__plot">
        <svg viewBox="0 0 360 100" preserveAspectRatio="none" data-weather-chart role="img" aria-label="予報データを待っています" hidden>
          <path class="weather-trend__grid" d="M0 16H360M0 40H360M0 64H360M0 96H360M90 0V100M180 0V100M270 0V100"/>
          <path class="weather-trend__rain" data-weather-chart-rain/>
          <path class="weather-trend__temperature" data-weather-chart-temperature/>
        </svg>
        <span class="weather-trend__empty" data-weather-chart-empty>予報を受信中…</span>
      </div>
      <div class="weather-trend__axis"><span data-weather-chart-start>--:--</span><span data-weather-chart-range>--</span><span data-weather-chart-end>--:--</span></div>
    </figure>
  </div>
  <section class="weather-calendar" aria-label="暦の詳細">
    <header><span>暦</span><time data-weather-calendar-time aria-label="現地時刻">--:--</time></header>
    <dl>
      <div><dt>新暦</dt><dd data-weather-calendar-gregorian>--</dd></div>
      <div><dt>旧暦</dt><dd data-weather-calendar-kyureki>--</dd></div>
      <div class="weather-calendar__gensokyo"><dt>幻想郷</dt><dd><span data-weather-calendar-gensokyo>--</span><small data-weather-calendar-attributes></small></dd></div>
    </dl>
  </section>
  <div class="weather-dial__actions" role="group" aria-label="天気の操作">
    <button class="weather-dial__button" type="button" data-weather-action="refresh" aria-label="天気を更新"><span aria-hidden="true">↻</span> 再観測</button>
    <button class="weather-dial__button" type="button" data-weather-action="locate" aria-label="現在地を使う"><span aria-hidden="true">⌖</span> 現在地</button>
  </div>
  <p class="weather-dial__status" data-weather-status aria-live="polite" hidden></p>
  <footer class="weather-dial__footer"><span>地点予報</span><a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo ↗</a></footer>
</section>
